apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ece1779
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # TO-DO: Replace with DOCR image and tag before applying.
          image: registry.digitalocean.com/OUR_REGISTRY/ece1779-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ece1779
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
