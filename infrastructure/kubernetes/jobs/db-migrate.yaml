# Applied by the CD workflow (not by `kubectl apply -f infrastructure/kubernetes/`,
# which is non-recursive). The workflow first creates the `db-sql` ConfigMap from
# database/*.sql and deletes any previous run, because Jobs are immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: ece1779
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      # Step 1 (initContainer): schema + seed. Step 2 (container): restaurant import.
      initContainers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -ec
            - |
              until pg_isready; do echo "waiting for postgres"; sleep 2; done

              # Schema files are idempotent, so they run on every deploy.
              psql -v ON_ERROR_STOP=1 -f /sql/001_initial_schema.sql
              psql -v ON_ERROR_STOP=1 -f /sql/002_api_contract_updates.sql

              # seed.sql is mock data that overwrites rows on conflict, so only
              # load it into an empty database, never over real data.
              if [ "$(psql -tA -c 'SELECT COUNT(*) FROM restaurants')" = "0" ]; then
                echo "restaurants empty: loading seed data"
                psql -v ON_ERROR_STOP=1 -f /sql/seed.sql
              else
                echo "restaurants not empty: skipping seed"
              fi
              echo "database migration complete"
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      containers:
        # Loads the OSM restaurant dataset only when no real restaurants exist yet
        # (--if-empty), so deploys never overwrite live data. Uses the backend image
        # for its `pg` dependency; the script and data come from the db-import ConfigMap.
        - name: import
          image: registry.digitalocean.com/OUR_REGISTRY/ece1779-backend:v1
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://restaurant_user:$(POSTGRES_PASSWORD)@postgres:5432/restaurant_app
          command:
            - sh
            - -ec
            - |
              # ESM needs a package.json/.mjs; link node_modules so `pg` resolves.
              mkdir -p /tmp/app && cd /tmp/app
              ln -s /app/node_modules node_modules
              cp /import/import_restaurants.js import.mjs
              node import.mjs --import --if-empty --file /import/restaurant-data-osm.json
          volumeMounts:
            - name: import
              mountPath: /import
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: db-sql
        - name: import
          configMap:
            name: db-import
