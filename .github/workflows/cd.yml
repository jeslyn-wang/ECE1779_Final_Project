name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    env:
      REGISTRY: registry.digitalocean.com/${{ vars.DOCR_REGISTRY_NAME }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/setup-buildx-action@v3

      # Free DOCR tier allows only 1 repository, so both images share `ece1779`
      # and are told apart by tag prefix.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/ece1779:backend-${{ env.TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          tags: ${{ env.REGISTRY }}/ece1779:frontend-${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 1800 "${{ vars.DOKS_CLUSTER_NAME }}"

      - name: Apply manifests with this commit's images
        run: |
          # Manifests carry a placeholder image; substitute on the runner so the
          # repo files stay unchanged and pods never pull the placeholder.
          sed -i "s#registry.digitalocean.com/OUR_REGISTRY/ece1779-backend:v1#${REGISTRY}/ece1779:backend-${TAG}#" infrastructure/kubernetes/backend.yaml
          sed -i "s#registry.digitalocean.com/OUR_REGISTRY/ece1779-frontend:v1#${REGISTRY}/ece1779:frontend-${TAG}#" infrastructure/kubernetes/frontend.yaml
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          kubectl apply -f infrastructure/kubernetes/

      - name: Run database migrations
        run: |
          # Ship the SQL as a ConfigMap, then run it as a one-off Job.
          kubectl -n ece1779 create configmap db-sql \
            --from-file=database/001_initial_schema.sql \
            --from-file=database/002_api_contract_updates.sql \
            --from-file=database/seed.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          # Jobs are immutable, so remove the previous run before applying.
          kubectl -n ece1779 delete job db-migrate --ignore-not-found --wait=true
          kubectl apply -f infrastructure/kubernetes/jobs/db-migrate.yaml
          if ! kubectl -n ece1779 wait --for=condition=complete job/db-migrate --timeout=180s; then
            kubectl -n ece1779 logs job/db-migrate --all-containers --tail=100 || true
            exit 1
          fi
          kubectl -n ece1779 logs job/db-migrate

      - name: Verify rollout
        run: |
          kubectl -n ece1779 rollout status deployment/backend --timeout=180s
          kubectl -n ece1779 rollout status deployment/frontend --timeout=180s

      - name: Roll back on failure
        if: failure()
        run: |
          kubectl -n ece1779 rollout undo deployment/backend || true
          kubectl -n ece1779 rollout undo deployment/frontend || true
