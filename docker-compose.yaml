services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_app}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-restaurant_app}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-ece1779-28b5d}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-false}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      import:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      # Vite bakes these in at build time (same values CD passes in production).
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-ece1779-28b5d}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  # Loads the 300-restaurant OSM dataset once, only if no real restaurants exist yet
  # (same rule as the production migration Job). Exits when done. Retries cover the
  # first start, when Postgres is still running its init scripts.
  import:
    build:
      context: ./backend
    restart: "on-failure:10"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-restaurant_app}
    volumes:
      - ./backend/scripts:/app/scripts:ro
      - ./database:/data:ro
    working_dir: /app
    command: ["node", "scripts/import_restaurants.js", "--import", "--if-empty", "--file", "/data/restaurant-data-osm.json"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
